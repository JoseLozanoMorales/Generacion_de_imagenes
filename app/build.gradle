plugins {
    alias(libs.plugins.android.application)
}

// 1. CARGAMOS local.properties AQUÍ (fuera del bloque android)
def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

android {
    namespace 'com.example.generacindeimagenes'
    compileSdk 36

    defaultConfig {
        applicationId "com.example.generacindeimagenes"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // 2. AHORA SÍ PODEMOS USAR localProperties
        def apiKey = localProperties.getProperty("OPENAI_API_KEY") ?: ""
        buildConfigField "String", "OPENAI_API_KEY", "\"${apiKey}\""
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'com.google.mlkit:face-detection:16.1.5'
    implementation 'com.google.mlkit:text-recognition:16.0.1'
    implementation 'com.google.mlkit:image-labeling:17.0.7'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'androidx.exifinterface:exifinterface:1.4.2'
    implementation 'androidx.work:work-runtime:2.9.0' // ✅ Una sola vez
    implementation 'com.github.bumptech.glide:glide:4.16.0' // ✅ Para GIFs
    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}